<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기용</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            overflow: hidden;
        }

        .main-sub-menu {
            display: flex;
            gap: 2px;
        }

        .main-sub-menu button,
        .main-sub-menu a {
            display: inline-block;
            padding: 3px 6px;
            font-size: 16px;
            font-family: inherit;
            color: #fff;
            background-color: #C7C7C7;
            border: none;
            border-radius: 5px 5px 0 0;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .main-sub-menu button:hover,
        .main-sub-menu a:hover {
            background-color: #AEAEAE;
        }

        .main {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            max-height: 700px;
            overflow-y: auto;
            overflow-x: hidden;
            width: 320px;
            height: 700px;

            &::-webkit-scrollbar {
                display: none;
                width: 0;
                height: 0;
            }

            scrollbar-width: none;

            -ms-overflow-style: none;
        }

        .editor-button {
            margin: 10px;
        }

        .editor-button a {
            display: inline-block;
            padding: 12px 25px;
            font-size: 18px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .editor-button a:hover {
            color: #AEAEAE;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 423px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        .bio {
            margin: 10px;
        }

        .bio p {
            margin: 0;
        }

        .profile img {
            border-radius: 50%;
            object-fit: cover;
            width: 200px;
            height: 200px;
        }

        #posts-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #posts-list li a {
            display: block;
            text-align: left;
            text-decoration: none;
            color: #000000;
            padding: 8px 12px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }


        #posts-list li a:hover {
            color: #AEAEAE;
        }

        #category-menu button {
            padding: 3px 3px;
            color: #AEAEAE;
            background-color: #ffffff;
            border: 1px solid #AEAEAE;
            border-radius: 20px;
            cursor: pointer;
            margin: 4px;
            transition: all 0.2s ease;
        }

        #category-menu button:hover {
            background-color: #AEAEAE;
            color: #ffffff;
        }

        #posts-list li.character {
            float: left;
            width: 96px;
            height: 120px;
            margin: 5px;
            list-style: none;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            font-size: 14px;
        }

        #posts-list::after {
            content: "";
            display: table;
            clear: both;
        }

        #posts-list li.character img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        #posts-list li.character img:hover {
            transform: scale(1.05);
        }

        .character-description {
            overflow-y: auto;
            max-height: 200px;
            margin-top: 10px;
            padding-right: 5px;
        }
    </style>
</head>

<body>
    <div id="home">

        <div class="main-sub">
            <div class="main-sub-menu">
                <button id="show-profile" style="margin-left: 7px;">프로필</button>
                <button id="show-categories">게시판</button>
                <a href="editor.html" class="editor-link">글쓰기</a>
            </div>
        </div>

        <div class="main">
            <div class="main-profile"></div>

            <div id="post-list-container">
                <div id="category-menu" style="display:none;">
                    <button data-category="all">전체</button>
                    <button data-category="공지">공지</button>
                    <button data-category="세계관">세계관</button>
                    <button data-category="자캐목록">자캐목록</button>
                </div>
                <ul id="posts-list" style="display:none;">
                    <li>글 목록이 여기에 표시됩니다</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btnProfile = document.getElementById("show-profile");
            const btnCategories = document.getElementById("show-categories");
            const categoryMenu = document.getElementById("category-menu");
            const postsList = document.getElementById("posts-list");
            const mainProfile = document.querySelector(".main-profile");

            postsList.style.display = "none";
            categoryMenu.style.display = "none";
            mainProfile.style.display = "block";

            btnProfile.addEventListener("click", () => {
                mainProfile.style.display = "block";
                categoryMenu.style.display = "none";
                postsList.style.display = "none";
            });

            btnCategories.addEventListener("click", () => {
                mainProfile.style.display = "none";
                categoryMenu.style.display = "block";
                postsList.style.display = "block";
            });

            loadProfile();
            loadPosts();
            setupCategoryFilter();
        });

        async function loadProfile() {
            try {
                const response = await fetch('profile.html');
                const html = await response.text();
                document.querySelector('.main-profile').innerHTML = html;
            } catch (err) {
                console.error("프로필 불러오기 실패:", err);
                document.querySelector('.main-profile').innerHTML = "<p>프로필 정보를 불러올 수 없습니다.</p>";
            }
        }

        const modal = document.createElement('div');
        const content = document.createElement('div');
        const closeBtn = document.createElement('span');

        modal.classList.add('modal');
        content.classList.add('modal-content');
        closeBtn.classList.add('modal-close');
        closeBtn.textContent = '×';

        content.appendChild(closeBtn);
        modal.appendChild(content);
        document.body.appendChild(modal);

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        async function loadPostContent(file, isCharacter = false) {
            try {
                const path = file.startsWith('posts/') ? file : `posts/${file}`;
                const response = await fetch(path);
                const post = await response.json();

                content.innerHTML = `
            <span class="modal-close">×</span>
            ${post.title ? `<h2>${post.title}</h2>` : ''}
            ${post.date ? `<p>${post.date}</p>` : ''}
            ${isCharacter && post.image ? `<img src="${post.image}" alt="자캐 이미지" style="max-width:100%;">` : ''}
            <div class="${isCharacter ? 'character-description' : ''}">${post.content_html}</div>
        `;

                modal.style.display = 'flex';

                content.querySelector('.modal-close').addEventListener('click', () => {
                    modal.style.display = 'none';
                });

            } catch (err) {
                console.error("게시글 불러오기 실패:", err);
                alert("게시글을 불러올 수 없습니다.");
            }
        }


        let allPosts = [];
        let allCharacters = [];
        async function loadPosts() {
            try {
                const responsePosts = await fetch('./post-data.json');
                allPosts = await responsePosts.json();

                const responseChars = await fetch('./character-data.json');
                allCharacters = await responseChars.json();

                renderPostList('all', false);
            } catch (err) {
                console.error("게시글/자캐 목록 불러오기 실패:", err);
                document.getElementById("posts-list").innerHTML = "<li>불러오기 오류</li>";
            }
        }


        function renderPostList(category, show = true) {
            const postListElement = document.getElementById("posts-list");
            postListElement.innerHTML = "";

            let filteredPosts;

            if (category === "자캐목록") {
                filteredPosts = allCharacters;
            } else {
                filteredPosts = category === 'all' ? allPosts : allPosts.filter(p => p.category === category);
            }

            if (!filteredPosts || filteredPosts.length === 0) {
                postListElement.innerHTML = "<li>아직 작성된 글이 없습니다.</li>";
            } else {
                filteredPosts.forEach(post => {
                    const li = document.createElement("li");

                    if (category === "자캐목록") {
                        li.classList.add("character");
                        const img = document.createElement("img");
                        img.src = post.thumbnail;
                        img.alt = post.title || "자캐 이미지";
                        li.appendChild(img);

                        li.addEventListener("click", () => {
                            loadPostContent(post.file, true);
                        });
                    } else {
                        const a = document.createElement("a");
                        a.href = "#";
                        a.textContent = post.title || "제목 없음";
                        a.addEventListener("click", e => {
                            e.preventDefault();
                            loadPostContent(post.file, false);
                        });
                        li.appendChild(a);
                    }

                    postListElement.appendChild(li);
                });
            }

            postListElement.style.display = show ? "block" : "none";
        }

        function setupCategoryFilter() {
            const buttons = document.querySelectorAll('#category-menu button');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    renderPostList(category);
                });
            });
        }
    </script>

</body>

</html>
