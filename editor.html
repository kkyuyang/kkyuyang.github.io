<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .editor-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2em;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #ffffff;
            margin: 0 5px;
            border: 1px solid #AEAEAE;
            border-radius: 20px 20px 0 0;
            color: #AEAEAE;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background-color: #AEAEAE;
            color: #ffffff;
        }

        .tab.active {
            background-color: #AEAEAE;
            color: #ffffff;
            font-weight: bold;
            border-bottom: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .input-group input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        #editor {
            height: 300px;
            background-color: #fefefe;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        .button-group {
            text-align: right;
        }

        .action-button {
            background-color: #ffffff;
            color: #AEAEAE;
            padding: 12px 25px;
            border: 1px solid #AEAEAE;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .action-button:hover {
            background-color: #AEAEAE;
            color: #ffffff;
        }

        .back-button {
            display: inline-block;
            background-color: #AEAEAE;
            color: #ffffff;
            border: 1px solid #AEAEAE;
            border-radius: 20px;
            padding: 12px 25px;
            font-size: 1em;
            text-decoration: none;
            cursor: pointer;
            transition: none;
        }
    </style>
</head>

<body>
    <div class="editor-container">

        <div class="tabs">
            <div class="tab active" data-type="post">게시글</div>
            <div class="tab" data-type="profile">프로필</div>
            <div class="tab" data-type="character">자캐</div>
        </div>

        <div class="input-group" id="post-title-group">
            <label for="post-title">제목:</label>
            <input type="text" id="post-title" placeholder="글 제목을 입력하세요">
        </div>

        <div class="input-group" id="profile-image-group" style="display:none;">
            <label for="profile-image">프로필 이미지 URL:</label>
            <input type="text" id="profile-image" placeholder="이미지 주소를 입력하세요">
        </div>

        <div class="input-group" id="profile-bio-group">
            <label id="editor-label">내용:</label>
            <div id="editor"></div>
        </div>

        <div class="input-group" id="character-image-group" style="display:none;">
            <label for="character-image">자캐 이미지 URL:</label>
            <input type="text" id="character-image" placeholder="이미지 주소를 입력하세요">
        </div>

        <div class="input-group" id="character-bio-group" style="display:none;">
            <label id="editor-label-character">소개글 / 설명:</label>
            <div id="editor-character"></div>
        </div>

        <div class="button-group">
            <a href="index.html" class="back-button">목록으로</a>
            <button id="save-json-button" class="action-button">내보내기</button>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: '여기에 글을 작성하세요...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    [{ 'indent': '-1' }, { 'indent': '+1' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        const quillCharacter = new Quill('#editor-character', {
            theme: 'snow',
            placeholder: '자캐 소개글을 입력하세요...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        const tabs = document.querySelectorAll('.tab');
        const postTitleGroup = document.getElementById('post-title-group');
        const profileImageGroup = document.getElementById('profile-image-group');
        const characterImageGroup = document.getElementById('character-image-group');
        const characterBioGroup = document.getElementById('character-bio-group');
        const editorLabel = document.getElementById('editor-label');

        let currentType = 'post';

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;

                postTitleGroup.style.display = currentType === 'post' ? 'block' : 'none';
                profileImageGroup.style.display = currentType === 'profile' ? 'block' : 'none';
                characterImageGroup.style.display = currentType === 'character' ? 'block' : 'none';

                document.getElementById('profile-bio-group').style.display = currentType === 'post' || currentType === 'profile' ? 'block' : 'none';
                document.getElementById('character-bio-group').style.display = currentType === 'character' ? 'block' : 'none';

                editorLabel.textContent = currentType === 'profile' ? '소개글:' : '내용:';

                quill.setContents([]);
                quillCharacter.setContents([]);

                if (currentType === 'character') {
                    document.querySelector('#editor-character .ql-editor').style.minHeight = '300px';
                }
            });
        });

        function downloadFile(filename, content, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('save-json-button').addEventListener('click', () => {
            if (currentType === 'post') {
                const title = document.getElementById('post-title').value;
                const content = quill.getContents();
                const htmlContent = quill.root.innerHTML;
                const date = new Date().toISOString().split('T')[0];

                const postData = {
                    title: title || "제목 없음",
                    date,
                    content_delta: content,
                    content_html: htmlContent
                };
                const filename = (title ? title.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 'untitled') + '.json';
                downloadFile(filename, JSON.stringify(postData, null, 2), 'application/json');
                alert('JSON 파일로 내보냈습니다!');
            } else if (currentType === 'profile') {
                const imageUrl = document.getElementById('profile-image').value || '';
                const bioHtml = quill.root.innerHTML;
                const profileContent = `<div class="profile">${imageUrl ? `<img src="${imageUrl}" alt="Profile Image">` : ''}<div class="bio">${bioHtml}</div></div>`;
                downloadFile('profile.html', profileContent, 'text/html');
                alert('HTML 파일로 내보냈습니다!');
            } else if (currentType === 'character') {
                const imageUrl = document.getElementById('character-image').value || '';
                const htmlContent = quillCharacter.root.innerHTML;
                const charData = {
                    image: imageUrl,
                    content_html: htmlContent
                };
                const filename = 'character_' + Date.now() + '.json';
                downloadFile(filename, JSON.stringify(charData, null, 2), 'application/json');
                alert('JSON 파일로 내보냈습니다!');
            }
        });
    </script>
</body>

</html>
